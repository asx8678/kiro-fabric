<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img" aria-labelledby="title desc">
  <title id="title">Sessions and storage</title>
  <desc id="desc">Kiro manages conversation history and compaction. Fabric owns a runtime for the verified workspace, creates a fresh QuickJS context per call, and stores durable memory and state outside installed runtime generations. Same-process compaction behavior awaits real-client qualification.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554} .title{font-size:28px;font-weight:700} .label{font-size:20px;font-weight:700} .body{font-size:17px;fill:#475569} .small{font-size:15px;fill:#475569} .mono{font-family:ui-monospace,monospace;font-size:18px} .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1080" height="490" rx="20" fill="#f8fafc"/>
  <text x="32" y="46" class="title">Conversation, execution, and durable data</text>
  <rect x="32" y="82" width="320" height="164" rx="12" fill="#ede9fe" stroke="#cbd5e1"/>
  <text x="52" y="116" class="label">Kiro CLI session</text>
  <text x="52" y="145" class="body">Prompts and replies</text>
  <text x="52" y="170" class="body">Saved conversation history</text>
  <text x="52" y="195" class="body">Context compaction</text>
  <rect x="408" y="82" width="640" height="164" rx="12" fill="#eff6ff" stroke="#cbd5e1"/>
  <text x="428" y="116" class="label">Fabric backend</text>
  <text x="428" y="145" class="body">Runtime for the verified workspace</text>
  <text x="428" y="170" class="body">Fresh QuickJS context for each fabric_exec call</text>
  <text x="428" y="195" class="body">Temporary artifacts expire</text>
  <path d="M 352 164 H 408" class="line"/>
  <rect x="32" y="302" width="480" height="132" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="336" class="label">Installed generation</text>
  <text x="52" y="365" class="body">Runtime + agent resources</text>
  <text x="52" y="390" class="body">Versioned code and resources</text>
  <rect x="568" y="302" width="480" height="132" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="588" y="336" class="label">Durable workspace data</text>
  <text x="588" y="365" class="body">Intentional memory + revisioned state</text>
  <text x="588" y="390" class="body">kiro-fabric/data/fabric/</text>
  <path d="M 480 302 V 246" class="line"/>
  <text x="293" y="281" class="small">loads</text>
  <path d="M 808 246 V 302" class="line"/>
  <text x="823" y="281" class="small">read / write</text>
  <text x="32" y="466" class="small">Same-process compaction and new-process resume still require authenticated real-client qualification.</text>
</svg>
