<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1638" viewBox="0 0 640 1638" role="img" aria-labelledby="title desc">
<title id="title">What survives between calls</title>
<desc id="desc">Kiro owns conversation history, compaction, and chat resume. Fabric caches a runtime for a verified workspace and can reuse a bounded compiler worker. Every fabric_exec creates a fresh QuickJS guest whose variables end with the call. Memory and revisioned state are durable and shared by chats bound to the same workspace. Overflow artifacts are temporary and process-owned, with a default one-hour idle expiry. Same-process compaction and new-process resume still need authenticated real-client qualification. A full text description is in docs/diagram-descriptions.md, Lifetimes.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker></defs>
<style>
text { font-family:Arial,Helvetica,sans-serif; fill:#111827; }
.title { font-size:36px; font-weight:700; fill:#ffffff; }
.subtitle { font-size:30px; fill:#ffffff; }
.label { font-size:32px; font-weight:700; }
.body { font-size:30px; }
.arrow { stroke:#334155; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<rect width="640" height="1638" fill="#f8fafc"/>
<rect width="640" height="126" fill="#172554"/>
<text x="24" y="51" class="title">What survives between calls</text>
<text x="24" y="97" class="subtitle">Different owners and lifetimes</text>
<g data-card="true"><rect x="24" y="156" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="204" class="label">Kiro owns the conversation</text>
<text x="46" y="254" class="body">Saved history and summaries.</text>
<text x="46" y="296" class="body">Context compaction.</text>
<text x="46" y="338" class="body">Chat resume.</text>
</g>
<g data-card="true"><rect x="24" y="412" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="460" class="label">Fabric retains a runtime</text>
<text x="46" y="510" class="body">Bound to a verified workspace.</text>
<text x="46" y="552" class="body">Compiler reuse has limits.</text>
<text x="46" y="594" class="body">Workspace changes can replace it.</text>
</g>
<g data-card="true"><rect x="24" y="668" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="716" class="label">Each call gets a fresh guest</text>
<text x="46" y="766" class="body">A new QuickJS context.</text>
<text x="46" y="808" class="body">Variables end with that call.</text>
<text x="46" y="850" class="body">Guest state is not reused.</text>
</g>
<g data-card="true"><rect x="24" y="924" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="972" class="label">Memory and state persist</text>
<text x="46" y="1022" class="body">Intentional workspace facts.</text>
<text x="46" y="1064" class="body">Revisioned task progress.</text>
<text x="46" y="1106" class="body">Shared by chats in that workspace.</text>
</g>
<g data-card="true"><rect x="24" y="1180" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1228" class="label">Artifacts are temporary</text>
<text x="46" y="1278" class="body">Process-owned overflow data.</text>
<text x="46" y="1320" class="body">Default idle expiry: 1 hour.</text>
<text x="46" y="1362" class="body">Do not rely on IDs after restart.</text>
</g>
<g data-card="true"><rect x="24" y="1436" width="592" height="170" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1484" class="body">Compaction / resume behavior</text>
<text x="46" y="1526" class="body">still needs real-client qualification.</text>
<text x="46" y="1568" class="body">Restart Kiro after an agent update.</text>
</g>
</svg>
