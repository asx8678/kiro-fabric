<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
<title id="title">Trace one read from code to response.</title>
<desc id="desc">The example TypeScript program awaits local.read for README.md, offset 1, limit 12, then returns the file result. The request passes admission and verified workspace checks, compiler validation or exact-source compiler reuse, a fresh QuickJS context, and the registry before the local provider reads. Selected illustrative response fields show source text, a full-file SHA-256, an unread suffix and nextOffset 13. A type error prevents any provider call. A policy denial prevents the provider invocation. Nested results return through QuickJS, and only the program return and printed logs are projected into the model-visible response.</desc>
<defs><marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245bd6"/></marker><marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087c74"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a34b13"/></marker><marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#53657b"/></marker></defs>
<rect width="1200" height="840" fill="#f8fafc"/>
<rect x="32" y="24" width="42" height="32" rx="6" fill="#245bd6" stroke="#245bd6" stroke-width="2"/>
<text xml:space="preserve" x="53" y="47" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">02</text>
<text xml:space="preserve" x="88" y="47" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">KIRO FABRIC / TECHNICAL WALKTHROUGH</text>
<text xml:space="preserve" x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#16283f" text-anchor="start">Trace one read from code to response.</text>
<text xml:space="preserve" x="32" y="135" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#53657b" text-anchor="start">Example: read the first 12 lines of README.md in one fabric_exec call.</text>
<g data-bounds="32 174 520 232"><rect x="32" y="174" width="520" height="232" rx="12" fill="#16283f" stroke="#16283f" stroke-width="2"/><text xml:space="preserve" x="56" y="210" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#afc7ff" text-anchor="start">Kiro sends this TypeScript body</text><text xml:space="preserve" x="56" y="252" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start">const file = await local.read({</text><text xml:space="preserve" x="56" y="281" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start">  path: &quot;README.md&quot;,</text><text xml:space="preserve" x="56" y="310" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start">  offset: 1, limit: 12</text><text xml:space="preserve" x="56" y="339" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start">});</text><text xml:space="preserve" x="56" y="368" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#ffffff" text-anchor="start">return file;</text></g>
<g data-bounds="648 174 520 232"><rect x="648" y="174" width="520" height="232" rx="12" fill="#eef8f6" stroke="#9ecdc5" stroke-width="2"/><text xml:space="preserve" x="672" y="210" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087c74" text-anchor="start">Response fields / illustrative</text><text xml:space="preserve" x="672" y="252" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">path: &quot;README.md&quot;</text><text xml:space="preserve" x="672" y="281" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">text: &quot;&lt;lines 1..12&gt;&quot;</text><text xml:space="preserve" x="672" y="310" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">sha256: &quot;&lt;full-file SHA-256&gt;&quot;</text><text xml:space="preserve" x="672" y="339" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">truncated: true</text><text xml:space="preserve" x="672" y="368" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">nextOffset: 13</text></g>
<path d="M156 406 V476" fill="none" stroke="#245bd6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#call)"/>
<text paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round" xml:space="preserve" x="174" y="452" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#245bd6" text-anchor="start">request</text>
<path d="M1044 482 V438 H920 V412" fill="none" stroke="#087c74" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#reply)" stroke-dasharray="7 6"/>
<text paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round" xml:space="preserve" x="664" y="467" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#087c74" text-anchor="start">via guest return + response projection</text>
<g data-bounds="32 482 248 124"><rect x="32" y="482" width="248" height="124" rx="12" fill="white" stroke="#cbd6e4" stroke-width="2"/><rect x="50" y="480" width="36" height="4" rx="2" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text xml:space="preserve" x="52" y="519" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#245bd6" text-anchor="start">1. Admit</text><text xml:space="preserve" x="52" y="554" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Request limits</text><text xml:space="preserve" x="52" y="582" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Verified workspace</text></g>
<g data-bounds="328 482 248 124"><rect x="328" y="482" width="248" height="124" rx="12" fill="white" stroke="#cbd6e4" stroke-width="2"/><rect x="346" y="480" width="36" height="4" rx="2" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text xml:space="preserve" x="348" y="519" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#245bd6" text-anchor="start">2. Compile</text><text xml:space="preserve" x="348" y="554" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Check TypeScript</text><text xml:space="preserve" x="348" y="582" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">or reuse exact code</text></g>
<g data-bounds="624 482 248 124"><rect x="624" y="482" width="248" height="124" rx="12" fill="white" stroke="#cbd6e4" stroke-width="2"/><rect x="642" y="480" width="36" height="4" rx="2" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text xml:space="preserve" x="644" y="519" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#245bd6" text-anchor="start">3. Run</text><text xml:space="preserve" x="644" y="554" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16283f" text-anchor="start">Fresh QuickJS</text><text xml:space="preserve" x="644" y="582" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16283f" text-anchor="start">await local.read(...)</text></g>
<g data-bounds="920 482 248 124"><rect x="920" y="482" width="248" height="124" rx="12" fill="white" stroke="#cbd6e4" stroke-width="2"/><rect x="938" y="480" width="36" height="4" rx="2" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text xml:space="preserve" x="940" y="519" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#245bd6" text-anchor="start">4. Gate + read</text><text xml:space="preserve" x="940" y="554" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">Registry permits</text><text xml:space="preserve" x="940" y="582" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">Local provider reads</text></g>
