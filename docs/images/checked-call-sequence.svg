<g data-bounds="920 670 248 106"><rect x="920" y="670" width="248" height="106" rx="12" fill="#fff5e9" stroke="#cbd6e4" stroke-width="2"/><rect x="938" y="668" width="36" height="4" rx="2" fill="#a34b13" stroke="#a34b13" stroke-width="2"/><text xml:space="preserve" x="940" y="707" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#a34b13" text-anchor="start">Policy denial</text><text xml:space="preserve" x="940" y="742" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#16283f" text-anchor="start">Provider not invoked</text></g>
<text xml:space="preserve" x="32" y="715" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53657b" text-anchor="start">Read policy defaults</text>
<text xml:space="preserve" x="32" y="743" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#53657b" text-anchor="start">to allow; overrides apply.</text>
<text xml:space="preserve" x="624" y="715" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53657b" text-anchor="start">VM variables end</text>
<text xml:space="preserve" x="624" y="743" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53657b" text-anchor="start">when this call ends.</text>
<text xml:space="preserve" x="32" y="820" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#53657b" text-anchor="start">truncated reports an unread suffix; nextOffset tells the caller where a follow-up read can start.</text>
