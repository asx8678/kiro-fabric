<text xml:space="preserve" x="88" y="47" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">KIRO FABRIC / TECHNICAL WALKTHROUGH</text>
<text xml:space="preserve" x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#16283f" text-anchor="start">Use the graph to choose the source to read.</text>
<text xml:space="preserve" x="32" y="135" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#53657b" text-anchor="start">Navigator returns a reading plan. Hash-checked local reads return the actual source.</text>
