<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906" viewBox="0 0 1200 906" role="img" aria-labelledby="title desc">
<title id="title">Use the graph to choose the source to read.</title>
<desc id="desc">A focus query for createKiroRuntime locates advisory graph relations. The schematic shows this repository function constructing LocalCodingProvider and FabricExecutionService. These are illustrative relations, not a recorded Navigator result. An illustrative read window names src/kiro/runtime.ts, offset 57, limit 16 and an expected full-file SHA-256 abbreviated H1. local.readMany validates the window through normal registry and read policy, checks its hash, and returns source text plus coverage and continuation metadata. repo.focusRead composes navigation and bounded reads. Graph coverage and actual source-read coverage remain distinct.</desc>
<defs><marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245bd6"/></marker><marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087c74"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a34b13"/></marker><marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#53657b"/></marker></defs>
<rect width="1200" height="906" fill="#f8fafc"/>
