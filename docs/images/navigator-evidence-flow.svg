<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">Navigator: from a code map to source evidence</title>
<desc id="desc">A verified workspace is captured into bounded source snapshots. The private ast-grep parser extracts symbols, imports, calls and anchors with explicit coverage. A typed graph supports sketch, focus and impact. Focus returns advisory text and SHA-256-bound source windows. Those windows pass through ordinary approved local.readMany calls with snapshot revalidation. Returned source text, hashes, failures and continuation metadata establish the reading evidence. repo.focusRead composes the two operations. Native prompt/stop delivery and chat lifecycle remain unqualified.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="920" fill="#f8fafc"/>
<path d="M0 0H1200V110H0Z" fill="#172554"/>
<text x="32" y="47" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">Navigator: from a code map to source evidence</text>
<text x="32" y="84" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#dbeafe" text-anchor="start">The repo namespace locates relevant code; local reads supply the actual bytes.</text>
<g data-card="true"><rect x="32" y="148" width="336" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M48 148 H352" stroke="#2563eb" stroke-width="4"/><text x="54" y="188" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">1. Capture the source</text><text x="54" y="226" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Verified workspace lease</text><text x="54" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Bounded private snapshots</text><text x="54" y="284" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Identity + content checks</text><text x="54" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Unsupported access fails closed</text></g>
<g data-card="true"><rect x="432" y="148" width="336" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M448 148 H752" stroke="#2563eb" stroke-width="4"/><text x="454" y="188" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">2. Extract code facts</text><text x="454" y="226" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Generation-private ast-grep</text><text x="454" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Symbols, imports, calls, anchors</text><text x="454" y="284" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Content-based fact reuse</text><text x="454" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Coverage gaps stay explicit</text></g>
<g data-card="true"><rect x="832" y="148" width="336" height="190" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2"/><path d="M848 148 H1152" stroke="#0f766e" stroke-width="4"/><text x="854" y="188" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#0f766e" text-anchor="start">3. Build navigation</text><text x="854" y="226" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Typed graph + query context</text><text x="854" y="255" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">repo.sketch / focus / impact</text><text x="854" y="284" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Rank related code locations</text><text x="854" y="313" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Graph results are advisory</text></g>
<path d="M368 242 H426" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M768 242 H826" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1000 338 V384 H200 V426" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><text paint-order="stroke" stroke="#f8fafc" stroke-width="8" stroke-linejoin="round" x="453" y="373" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">Resolve source windows from navigation</text></g>
<g data-card="true"><rect x="32" y="432" width="336" height="198" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2"/><path d="M48 432 H352" stroke="#0f766e" stroke-width="4"/><text x="54" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#0f766e" text-anchor="start">4. Return a focus</text><text x="54" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">navigation.text + reads[]</text><text x="54" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Each window names:</text><text x="54" y="568" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">path, offset, limit,</text><text x="54" y="597" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">expectedSha256</text></g>
<g data-card="true"><rect x="432" y="432" width="336" height="198" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M448 432 H752" stroke="#2563eb" stroke-width="4"/><text x="454" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">5. Read those windows</text><text x="454" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">local.readMany({ windows })</text><text x="454" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Normal registry + read policy</text><text x="454" y="568" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Validate expected SHA-256</text><text x="454" y="597" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Revalidate snapshots at return</text></g>
<g data-card="true"><rect x="832" y="432" width="336" height="198" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M848 432 H1152" stroke="#2563eb" stroke-width="4"/><text x="854" y="472" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">6. Inspect the evidence</text><text x="854" y="510" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Actual source text + hashes</text><text x="854" y="539" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Failures and coverage limits</text><text x="854" y="568" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">remaining + unreadTails</text><text x="854" y="597" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Use the read hash for edits</text></g>
<path d="M368 532 H426" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M768 532 H826" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="674" width="1136" height="100" rx="12" fill="#172554" stroke="#172554" stroke-width="2"/>
<text x="56" y="713" font-family="Consolas,Menlo,monospace" font-size="24" font-weight="400" fill="#ffffff" text-anchor="start">repo.focusRead({ query: &quot;createKiroRuntime&quot; })</text>
<text x="56" y="750" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#dbeafe" text-anchor="start">Composes focus + bounded local.readMany through the same registry, quotas and read policy.</text>
<text x="32" y="817" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Stale hash: refresh the focus and reread. Unavailable analysis: disclose gaps and use permitted local search/read.</text>
<rect x="32" y="845" width="1136" height="49" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<text x="52" y="877" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#92400e" text-anchor="start">Native prompt/stop delivery and chat lifecycle remain unqualified; same-call advisory suffixes are separate.</text>
</svg>
