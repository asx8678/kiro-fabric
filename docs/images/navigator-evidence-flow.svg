<text xml:space="preserve" x="32" y="888" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53657b" text-anchor="start">repo.focusRead(...) composes these steps. H1 abbreviates a full-file SHA-256, never a graph version.</text>
