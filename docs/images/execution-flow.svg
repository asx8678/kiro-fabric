<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1692" viewBox="0 0 640 1692" role="img" aria-labelledby="title desc">
<title id="title">One request, step by step</title>
<desc id="desc">Follow steps 1 through 6 from top to bottom. Kiro sends TypeScript through fabric_exec over stdio MCP. Fabric verifies the workspace, admits the request, checks types in a compiler worker, then runs a fresh QuickJS guest. Each action crosses JSON validation, schemas, effect reservations, and approval policy. The guest selects a bounded result for Kiro. A full text description is in docs/diagram-descriptions.md, Execution.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker></defs>
<style>
text { font-family:Arial,Helvetica,sans-serif; fill:#111827; }
.title { font-size:36px; font-weight:700; fill:#ffffff; }
.subtitle { font-size:30px; fill:#ffffff; }
.label { font-size:32px; font-weight:700; }
.body { font-size:30px; }
.arrow { stroke:#334155; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<rect width="640" height="1692" fill="#f8fafc"/>
<rect width="640" height="126" fill="#172554"/>
<text x="24" y="51" class="title">One request, step by step</text>
<text x="24" y="97" class="subtitle">Kiro → Fabric → tools → Kiro</text>
<g data-card="true"><rect x="24" y="156" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="204" class="label">1. Kiro submits a program</text>
<text x="46" y="254" class="body">Agent: kiro-fabric</text>
<text x="46" y="296" class="body">Only tool: @fabric/fabric_exec</text>
<text x="46" y="338" class="body">Private backend over stdio MCP.</text>
</g>
<path d="M320 380 V406" class="arrow"/>
<g data-card="true"><rect x="24" y="412" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="460" class="label">2. Bind and admit</text>
<text x="46" y="510" class="body">Verify the workspace root.</text>
<text x="46" y="552" class="body">Up to 4 executions per service.</text>
<text x="46" y="594" class="body">Excess executions are rejected.</text>
</g>
<path d="M320 636 V662" class="arrow"/>
<g data-card="true"><rect x="24" y="668" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="716" class="label">3. Check TypeScript</text>
<text x="46" y="766" class="body">Compile against Fabric APIs.</text>
<text x="46" y="808" class="body">Restrict compiler file access.</text>
<text x="46" y="850" class="body">Type errors stop execution.</text>
</g>
<path d="M320 892 V918" class="arrow"/>
<g data-card="true"><rect x="24" y="924" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="972" class="label">4. Run fresh QuickJS</text>
<text x="46" y="1022" class="body">New guest context for each call.</text>
<text x="46" y="1064" class="body">No direct files, shell, or network.</text>
<text x="46" y="1106" class="body">Host calls use a JSON bridge.</text>
</g>
<path d="M320 1148 V1174" class="arrow"/>
<g data-card="true"><rect x="24" y="1180" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1228" class="label">5. Gate every action</text>
<text x="46" y="1278" class="body">Validate the argument schema.</text>
<text x="46" y="1320" class="body">Reserve effects; apply approvals.</text>
<text x="46" y="1362" class="body">Invoke local, data, or MCP tools.</text>
</g>
<path d="M320 1404 V1430" class="arrow"/>
<g data-card="true"><rect x="24" y="1436" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1484" class="label">6. Return useful evidence</text>
<text x="46" y="1534" class="body">Guest filters and combines data.</text>
<text x="46" y="1576" class="body">Fabric bounds the visible result.</text>
<text x="46" y="1618" class="body">Kiro answers or continues.</text>
</g>
</svg>
