<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="680" viewBox="0 0 1080 680" role="img" aria-labelledby="title desc">
  <title id="title">From a prompt to workspace actions</title>
  <desc id="desc">Kiro CLI v3 exposes fabric_exec. A private Fabric MCP backend type-checks TypeScript, executes it in QuickJS, and applies schemas and approval policy before provider actions. Results return to Kiro.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#172554} .title{font-size:28px;font-weight:700} .label{font-size:20px;font-weight:700} .body{font-size:17px;fill:#475569} .small{font-size:15px;fill:#475569} .mono{font-family:ui-monospace,monospace;font-size:18px} .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  <rect width="1080" height="680" rx="20" fill="#f8fafc"/>
  <text x="32" y="46" class="title">One tool. Checked code. Controlled actions.</text>
  <rect x="32" y="80" width="270" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="52" y="114" class="label">You</text>
  <text x="52" y="143" class="body">Describe the task</text>
  <rect x="358" y="80" width="330" height="108" rx="12" fill="#ede9fe" stroke="#cbd5e1"/>
  <text x="378" y="114" class="label">Kiro CLI v3</text>
  <text x="378" y="143" class="body">Agent: kiro-fabric</text>
  <text x="378" y="168" class="body">Tool: @fabric/fabric_exec</text>
  <rect x="744" y="80" width="304" height="108" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="764" y="114" class="label">Response</text>
  <text x="764" y="143" class="body">Kiro uses the result</text>
  <text x="764" y="168" class="body">to answer or continue</text>
  <path d="M 302 134 H 358" class="line"/>
  <rect x="32" y="230" width="1016" height="246" rx="16" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="52" y="263" class="small">FABRIC · PRIVATE STDIO MCP BACKEND</text>
  <rect x="56" y="295" width="260" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="76" y="329" class="label">1 · Type-check</text>
  <text x="76" y="358" class="body">Validate TypeScript</text>
  <text x="76" y="383" class="body">before running it</text>
  <rect x="370" y="295" width="300" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="390" y="329" class="label">2 · Run in QuickJS</text>
  <text x="390" y="358" class="body">Fresh context per call</text>
  <text x="390" y="383" class="body">No ambient host APIs</text>
  <rect x="724" y="295" width="300" height="112" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="744" y="329" class="label">3 · Validate + approve</text>
  <text x="744" y="358" class="body">Check action schemas</text>
  <text x="744" y="383" class="body">Apply exact effect policy</text>
  <path d="M 440 188 V 212 H 186 V 295" class="line"/>
  <text x="211" y="220" class="small">TypeScript</text>
  <path d="M 316 350 H 370" class="line"/>
  <path d="M 670 350 H 724" class="line"/>
  <path d="M 1008 295 V 188" class="line"/>
  <text x="867" y="220" class="small">Result / error</text>
  <text x="56" y="450" class="body">Provider calls use a bounded JSON bridge. Outer tool allowance does not authorize inner effects.</text>
  <path d="M 874 407 V 505 H 195 V 538" class="line"/>
  <path d="M 540 505 V 538" class="line"/>
  <path d="M 874 505 V 538" class="line"/>
  <rect x="32" y="538" width="326" height="110" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="52" y="572" class="label">Local coding</text>
  <text x="52" y="601" class="body">Read · search · edit · shell</text>
  <text x="52" y="626" class="body">Verified workspace</text>
  <rect x="378" y="538" width="324" height="110" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="398" y="572" class="label">Memory + state</text>
  <text x="398" y="601" class="body">Durable facts and progress</text>
  <text x="398" y="626" class="body">Scoped to the workspace</text>
  <rect x="722" y="538" width="326" height="110" rx="12" fill="#ecfdf5" stroke="#cbd5e1"/>
  <text x="742" y="572" class="label">Configured MCP</text>
  <text x="742" y="601" class="body">External tools and services</text>
  <text x="742" y="626" class="body">Explicit configuration required</text>
</svg>
