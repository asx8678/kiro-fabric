<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1596" viewBox="0 0 640 1596" role="img" aria-labelledby="title desc">
<title id="title">How output stays bounded</title>
<desc id="desc">Provider results cross a bounded JSON bridge, with a default nested result budget of two million characters. Guest code selects evidence. The formatted visible response has a default 50,000-character budget and an additional 20,000-character ceiling for failures. If output fits it is returned directly. Oversized output gets a head-and-tail preview and a temporary artifact when retention succeeds. Failed retention is reported as an error. Artifacts cannot recover provider-truncated data. A full text description is in docs/diagram-descriptions.md, Output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker></defs>
<style>
text { font-family:Arial,Helvetica,sans-serif; fill:#111827; }
.title { font-size:36px; font-weight:700; fill:#ffffff; }
.subtitle { font-size:30px; fill:#ffffff; }
.label { font-size:32px; font-weight:700; }
.body { font-size:30px; }
.arrow { stroke:#334155; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<rect width="640" height="1596" fill="#f8fafc"/>
<rect width="640" height="126" fill="#172554"/>
<text x="24" y="51" class="title">How output stays bounded</text>
<text x="24" y="97" class="subtitle">Two limits, then overflow handling</text>
<g data-card="true"><rect x="24" y="156" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="204" class="label">1. Bound nested results</text>
<text x="46" y="254" class="body">Default: 2,000,000 characters.</text>
<text x="46" y="296" class="body">Provider limits also apply.</text>
<text x="46" y="338" class="body">Guest code selects evidence.</text>
</g>
<path d="M320 380 V406" class="arrow"/>
<g data-card="true"><rect x="24" y="412" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="460" class="label">2. Bound the visible response</text>
<text x="46" y="510" class="body">Default: 50,000 characters.</text>
<text x="46" y="552" class="body">Failure ceiling: 20,000 characters.</text>
<text x="46" y="594" class="body">Value, logs, and diagnostics count.</text>
</g>
<g data-card="true"><rect x="24" y="668" width="592" height="176" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="716" class="label">Case A: output fits</text>
<text x="46" y="766" class="body">Return the formatted response.</text>
<text x="46" y="808" class="body">No overflow artifact needed.</text>
</g>
<g data-card="true"><rect x="24" y="882" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="930" class="label">Case B: overflow retained</text>
<text x="46" y="980" class="body">Return a head-and-tail preview.</text>
<text x="46" y="1022" class="body">Keep full response in an artifact.</text>
<text x="46" y="1064" class="body">Read more in bounded pages.</text>
</g>
<g data-card="true"><rect x="24" y="1138" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1186" class="label">Case C: retention fails</text>
<text x="46" y="1236" class="body">Return a bounded preview.</text>
<text x="46" y="1278" class="body">Report missing full response.</text>
<text x="46" y="1320" class="body">Mark the response as an error.</text>
</g>
<g data-card="true"><rect x="24" y="1394" width="592" height="170" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1442" class="body">Artifacts are temporary.</text>
<text x="46" y="1484" class="body">They cannot restore data already</text>
<text x="46" y="1526" class="body">truncated by a provider.</text>
</g>
</svg>
