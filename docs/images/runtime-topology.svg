<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="950" viewBox="0 0 1200 950" role="img" aria-labelledby="title desc">
<title id="title">Kiro + Fabric: runtime topology</title>
<desc id="desc">Kiro CLI sends fabric_exec over stdio MCP to a private Fabric process. A verified workspace runtime uses a compiler worker, fresh QuickJS in a sandbox worker, and a bounded JSON bridge to ActionRegistry. Ten provider namespaces are grouped by purpose. The host owns a separate lazy Navigator engine child. Availability depends on verified bindings and configuration. This depicts the profile contract, not native-client qualification.</desc>
