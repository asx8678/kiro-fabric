<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="title desc">
<title id="title">Kiro plans. Fabric executes.</title>
<desc id="desc">Kiro CLI owns conversation and planning. It calls fabric_exec over stdio MCP into a separate Fabric Node.js process. A compiler worker checks TypeScript, a fresh QuickJS guest in a sandbox worker runs it, and JSON host calls reach ActionRegistry for schema, exact-request and policy checks. Provider routes reach local files and shell, the separate Navigator child, workspace data, or configured MCP servers. Nested results return to the guest; the guest selects a value and logs, which response projection bounds before returning them to Kiro. Worker threads remain inside the Fabric process. The diagram omits support providers; the text reference lists the full inventory.</desc>
