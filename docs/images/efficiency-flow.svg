<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1382" viewBox="0 0 640 1382" role="img" aria-labelledby="title desc">
<title id="title">Where efficiency comes from</title>
<desc id="desc">Four independent file reads can be expressed in one outer execution while still making four provider calls. Independent I/O can overlap under an eight-call concurrency cap. Guest code filters intermediate data before returning evidence. A bounded compiler pool reuses one idle worker for up to 30 seconds, recycling at 250 uses. Every guest is still fresh. End-to-end savings have not been established. A full text description is in docs/diagram-descriptions.md, Efficiency.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker></defs>
<style>
text { font-family:Arial,Helvetica,sans-serif; fill:#111827; }
.title { font-size:36px; font-weight:700; fill:#ffffff; }
.subtitle { font-size:30px; fill:#ffffff; }
.label { font-size:32px; font-weight:700; }
.body { font-size:30px; }
.arrow { stroke:#334155; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<rect width="640" height="1382" fill="#f8fafc"/>
<rect width="640" height="126" fill="#172554"/>
<text x="24" y="51" class="title">Where efficiency comes from</text>
<text x="24" y="97" class="subtitle">Less coordination and less output</text>
<g data-card="true"><rect x="24" y="156" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="204" class="label">1. Batch routine tool work</text>
<text x="46" y="254" class="body">Example: 1 exec → 4 file reads.</text>
<text x="46" y="296" class="body">Four provider calls still happen.</text>
<text x="46" y="338" class="body">Fewer model/tool exchanges.</text>
</g>
<g data-card="true"><rect x="24" y="412" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="460" class="label">2. Overlap independent I/O</text>
<text x="46" y="510" class="body">Default: up to 8 host calls at once.</text>
<text x="46" y="552" class="body">Extra parallel work waits.</text>
<text x="46" y="594" class="body">Dependent steps stay sequential.</text>
</g>
<g data-card="true"><rect x="24" y="668" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="716" class="label">3. Reduce data in code</text>
<text x="46" y="766" class="body">Filter and combine in the guest.</text>
<text x="46" y="808" class="body">Return only the needed fields.</text>
<text x="46" y="850" class="body">Intermediate data stays local.</text>
</g>
<g data-card="true"><rect x="24" y="924" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="972" class="label">4. Reuse the compiler</text>
<text x="46" y="1022" class="body">At most 1 warm idle worker.</text>
<text x="46" y="1064" class="body">Idle expiry: 30 seconds.</text>
<text x="46" y="1106" class="body">Recycle worker after 250 uses.</text>
</g>
<g data-card="true"><rect x="24" y="1180" width="592" height="170" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1228" class="body">Each call still gets a fresh guest.</text>
<text x="46" y="1270" class="body">Compilation and checks add cost.</text>
<text x="46" y="1312" class="body">Savings are not yet benchmarked.</text>
</g>
</svg>
