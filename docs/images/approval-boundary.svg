<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1596" viewBox="0 0 640 1596" role="img" aria-labelledby="title desc">
<title id="title">Every effect is checked</title>
<desc id="desc">An allowed fabric_exec request does not approve its nested effects. The ActionRegistry prepares and freezes canonical arguments, checks their schema, and reserves audit and effect capacity before evaluating allow, ask, or deny policy. Read defaults to allow; write, execute, and network default to ask. The default audit budget admits at most 31 audited calls. Approved shell commands have host authority, and later failures do not undo earlier effects. A full text description is in docs/diagram-descriptions.md, Permissions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker></defs>
<style>
text { font-family:Arial,Helvetica,sans-serif; fill:#111827; }
.title { font-size:36px; font-weight:700; fill:#ffffff; }
.subtitle { font-size:30px; fill:#ffffff; }
.label { font-size:32px; font-weight:700; }
.body { font-size:30px; }
.arrow { stroke:#334155; stroke-width:4; fill:none; marker-end:url(#arrow); }
</style>
<rect width="640" height="1596" fill="#f8fafc"/>
<rect width="640" height="126" fill="#172554"/>
<text x="24" y="51" class="title">Every effect is checked</text>
<text x="24" y="97" class="subtitle">Outer allowance ≠ inner approval</text>
<g data-card="true"><rect x="24" y="156" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="204" class="label">1. Fix the exact request</text>
<text x="46" y="254" class="body">Resolve the action descriptor.</text>
<text x="46" y="296" class="body">Prepare and freeze arguments.</text>
<text x="46" y="338" class="body">Validate the input schema.</text>
</g>
<path d="M320 380 V406" class="arrow"/>
<g data-card="true"><rect x="24" y="412" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="460" class="label">2. Reserve before prompting</text>
<text x="46" y="510" class="body">Reserve affected resources.</text>
<text x="46" y="552" class="body">Reject conflicting writes.</text>
<text x="46" y="594" class="body">Reserve audit capacity.</text>
</g>
<path d="M320 636 V662" class="arrow"/>
<g data-card="true"><rect x="24" y="668" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="716" class="label">3. Apply the action policy</text>
<text x="46" y="766" class="body">ALLOW → run the action.</text>
<text x="46" y="808" class="body">ASK → run only after approval.</text>
<text x="46" y="850" class="body">DENY → return a failure.</text>
</g>
<g data-card="true"><rect x="24" y="924" width="592" height="176" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="972" class="label">Default policy</text>
<text x="46" y="1022" class="body">Read: allow.</text>
<text x="46" y="1064" class="body">Write / execute / network: ask.</text>
</g>
<g data-card="true"><rect x="24" y="1138" width="592" height="218" rx="12" fill="#ffffff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1186" class="label">Default audit ceiling</text>
<text x="46" y="1236" class="body">64,000 bytes per execution.</text>
<text x="46" y="1278" class="body">2,048 bytes per audited call.</text>
<text x="46" y="1320" class="body">At most 31 audited calls.</text>
</g>
<g data-card="true"><rect x="24" y="1394" width="592" height="170" rx="12" fill="#eff6ff" stroke="#334155" stroke-width="2"/>
<text x="46" y="1442" class="body">Shell runs with host OS authority.</text>
<text x="46" y="1484" class="body">Failure does not undo prior effects.</text>
<text x="46" y="1526" class="body">Inspect state before retrying.</text>
</g>
</svg>
