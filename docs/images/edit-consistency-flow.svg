<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="822" viewBox="0 0 1200 822" role="img" aria-labelledby="title desc">
<title id="title">The read hash travels with the edit.</title>
<desc id="desc">Read the source and keep its full-file SHA-256, abbreviated H1. Prepare local.edit with expectedSha256 H1 and exact replacements, reserve write intent, and obtain permission under the current write policy, which defaults to ask. Before publication, recheck file and parent identities and current source content. If the current snapshot matches, publish the prepared bytes and return the new SHA-256, H2. If an external writer changed the file while approval was pending, hash Hx differs from H1 and publication is refused. Reread and prepare a new request. These are conflict checks, not hostile-race isolation or rollback of earlier effects.</desc>
<defs><marker id="call" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#245bd6"/></marker><marker id="reply" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#087c74"/></marker><marker id="stop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a34b13"/></marker><marker id="neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#53657b"/></marker></defs>
<rect width="1200" height="822" fill="#f8fafc"/>
<rect x="32" y="24" width="42" height="32" rx="6" fill="#245bd6" stroke="#245bd6" stroke-width="2"/>
<text xml:space="preserve" x="53" y="47" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">04</text>
<text xml:space="preserve" x="88" y="47" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">KIRO FABRIC / TECHNICAL WALKTHROUGH</text>
<text xml:space="preserve" x="32" y="99" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#16283f" text-anchor="start">The read hash travels with the edit.</text>
<text xml:space="preserve" x="32" y="135" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#53657b" text-anchor="start">The prepared request keeps H1; the file must still match just before publication.</text>
<text xml:space="preserve" x="32" y="202" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">1. READ</text>
<text xml:space="preserve" x="344" y="202" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">2. PREPARE + PERMIT</text>
<text xml:space="preserve" x="728" y="202" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">3. RECHECK</text>
<text xml:space="preserve" x="966" y="202" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#53657b" text-anchor="start">4. PUBLISH</text>
<g data-bounds="32 242 250 176"><rect x="32" y="242" width="250" height="176" rx="12" fill="white" stroke="#cbd6e4" stroke-width="2"/><rect x="50" y="240" width="36" height="4" rx="2" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text xml:space="preserve" x="52" y="279" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#245bd6" text-anchor="start">Read source</text><text xml:space="preserve" x="52" y="314" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Text + file identity</text><text xml:space="preserve" x="52" y="342" font-family="Menlo,Consolas,monospace" font-size="22" font-weight="400" fill="#a34b13" text-anchor="start">sha256: H1</text><text xml:space="preserve" x="52" y="370" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Keep the read hash</text></g>
<g data-bounds="344 242 280 176"><rect x="344" y="242" width="280" height="176" rx="12" fill="white" stroke="#cbd6e4" stroke-width="2"/><rect x="362" y="240" width="36" height="4" rx="2" fill="#245bd6" stroke="#245bd6" stroke-width="2"/><text xml:space="preserve" x="364" y="279" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#245bd6" text-anchor="start">Prepare exact edit</text><text xml:space="preserve" x="364" y="314" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#a34b13" text-anchor="start">expectedSha256: H1</text><text xml:space="preserve" x="364" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">Diff + write reservation</text><text xml:space="preserve" x="364" y="370" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">Apply policy / approval</text></g>
<path d="M282 325 H338" fill="none" stroke="#245bd6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#call)"/>
<path d="M624 325 H710" fill="none" stroke="#245bd6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#call)"/>
<path d="M802 242 890 325 802 408 714 325Z" fill="#fff5e9" stroke="#a34b13" stroke-width="2"/>
<text xml:space="preserve" x="802" y="314" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#a34b13" text-anchor="middle">Current hash</text>
<text xml:space="preserve" x="802" y="346" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#a34b13" text-anchor="middle">= H1?</text>
<path d="M890 325 H960" fill="none" stroke="#245bd6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#call)"/>
<text paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round" xml:space="preserve" x="926" y="305" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#245bd6" text-anchor="middle">match</text>
<g data-bounds="966 242 202 176"><rect x="966" y="242" width="202" height="176" rx="12" fill="#eef8f6" stroke="#cbd6e4" stroke-width="2"/><rect x="984" y="240" width="36" height="4" rx="2" fill="#087c74" stroke="#087c74" stroke-width="2"/><text xml:space="preserve" x="986" y="279" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#087c74" text-anchor="start">Publish</text><text xml:space="preserve" x="986" y="314" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">Prepared bytes</text><text xml:space="preserve" x="986" y="342" font-family="Menlo,Consolas,monospace" font-size="21" font-weight="400" fill="#087c74" text-anchor="start">sha256: H2</text><text xml:space="preserve" x="986" y="370" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#16283f" text-anchor="start">Then verify</text></g>
<text xml:space="preserve" x="780" y="444" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#53657b" text-anchor="end">Identity also checked</text>
<path d="M802 408 V524" fill="none" stroke="#a34b13" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#stop)"/>
<text paint-order="stroke" stroke="#f8fafc" stroke-width="7" stroke-linejoin="round" xml:space="preserve" x="819" y="487" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#a34b13" text-anchor="start">changed</text>
<g data-bounds="32 530 544 150"><rect x="32" y="530" width="544" height="150" rx="12" fill="#f0f4fa" stroke="#cbd6e4" stroke-width="2"/><rect x="50" y="528" width="36" height="4" rx="2" fill="#53657b" stroke="#53657b" stroke-width="2"/><text xml:space="preserve" x="52" y="567" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#53657b" text-anchor="start">While approval is pending</text><text xml:space="preserve" x="52" y="602" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">An external writer may change the file:</text><text xml:space="preserve" x="52" y="630" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">H1 becomes Hx. The request still holds H1.</text></g>
<path d="M576 603 H642" fill="none" stroke="#a34b13" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#stop)"/>
<g data-bounds="648 530 520 150"><rect x="648" y="530" width="520" height="150" rx="12" fill="#fff5e9" stroke="#cbd6e4" stroke-width="2"/><rect x="666" y="528" width="36" height="4" rx="2" fill="#a34b13" stroke="#a34b13" stroke-width="2"/><text xml:space="preserve" x="668" y="567" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700" fill="#a34b13" text-anchor="start">Refuse this write</text><text xml:space="preserve" x="668" y="602" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Current Hx does not match expected H1.</text><text xml:space="preserve" x="668" y="630" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#16283f" text-anchor="start">Reread, prepare a new diff, and retry.</text></g>
<text xml:space="preserve" x="32" y="730" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#53657b" text-anchor="start">H1 / H2 / Hx stand for complete SHA-256 hashes. Default write policy: ask.</text>
<text xml:space="preserve" x="32" y="768" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#53657b" text-anchor="start">A later failure does not undo an earlier write. Snapshot checks do not provide OS-level race isolation.</text>
<text xml:space="preserve" x="32" y="804" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#087c74" text-anchor="start">Approval binds the same canonical request used for invocation.</text>
</svg>
