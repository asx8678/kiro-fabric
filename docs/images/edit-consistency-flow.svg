<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
<title id="title">An edit is bound to the file version you read</title>
<desc id="desc">local.read returns source text and its full-file SHA-256. local.edit requires that expected hash and exact replacement anchors. Fabric captures a snapshot, rejects stale or ambiguous edits, constructs a complete diff, validates and freezes the canonical request. The registry reserves write intent and audit capacity; the local provider acquires a cross-process lock before approval. Policy then allows, asks, or denies that exact request. Before publishing the prepared bytes, the provider revalidates the snapshot. Later verification is a separate action. A changed file requires a reread, and later program failure does not undo an earlier published edit.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2563eb"/></marker></defs>
<rect width="1200" height="940" fill="#f8fafc"/>
<path d="M0 0H1200V110H0Z" fill="#172554"/>
<text x="32" y="47" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="700" fill="#ffffff" text-anchor="start">An edit is bound to the file version you read</text>
<text x="32" y="84" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#dbeafe" text-anchor="start">Follow steps 1-3 left to right, then 4-6 right to left. Approval binds the prepared request.</text>
<g data-card="true"><rect x="32" y="150" width="336" height="216" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M48 150 H352" stroke="#2563eb" stroke-width="4"/><text x="54" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">1. Read a real snapshot</text><text x="54" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">local.read / local.readMany</text><text x="54" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Source text + full-file SHA-256</text><text x="54" y="286" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Keep the hash with the anchors</text><text x="54" y="315" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">for the intended replacement.</text></g>
<g data-card="true"><rect x="432" y="150" width="336" height="216" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M448 150 H752" stroke="#2563eb" stroke-width="4"/><text x="454" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">2. Prepare the exact edit</text><text x="454" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">local.edit({ expectedSha256,</text><text x="454" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">  oldText, newText, path })</text><text x="454" y="286" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Reject stale or ambiguous edits</text><text x="454" y="315" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Freeze canonical args + diff</text></g>
<g data-card="true"><rect x="832" y="150" width="336" height="216" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2"/><path d="M848 150 H1152" stroke="#0f766e" stroke-width="4"/><text x="854" y="190" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#0f766e" text-anchor="start">3. Reserve before asking</text><text x="854" y="228" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Registry write intent</text><text x="854" y="257" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Audit capacity reservation</text><text x="854" y="286" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Provider cross-process lock</text><text x="854" y="315" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Conflicting writes fail early</text></g>
<path d="M368 250 H426" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M768 250 H826" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M1000 366 V458" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<g><text paint-order="stroke" stroke="#f8fafc" stroke-width="8" stroke-linejoin="round" x="1016" y="418" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#475569" text-anchor="start">same request</text></g>
<g data-card="true"><rect x="832" y="464" width="336" height="216" rx="12" fill="#f0fdfa" stroke="#cbd5e1" stroke-width="2"/><path d="M848 464 H1152" stroke="#0f766e" stroke-width="4"/><text x="854" y="504" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#0f766e" text-anchor="start">4. Apply write policy</text><text x="854" y="542" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">allow, or ask + approval</text><text x="854" y="571" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Default write policy: ask</text><text x="854" y="600" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">deny / decline / missing UI</text><text x="854" y="629" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">blocks this publication</text></g>
<g data-card="true"><rect x="432" y="464" width="336" height="216" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M448 464 H752" stroke="#2563eb" stroke-width="4"/><text x="454" y="504" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">5. Revalidate + publish</text><text x="454" y="542" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Recheck snapshot identities</text><text x="454" y="571" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">and source content hash</text><text x="454" y="600" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Publish the prepared bytes</text><text x="454" y="629" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#142338" text-anchor="start">Return changed + new SHA-256</text></g>
<g data-card="true"><rect x="32" y="464" width="336" height="216" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><path d="M48 464 H352" stroke="#2563eb" stroke-width="4"/><text x="54" y="504" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#2563eb" text-anchor="start">6. Verify the result</text><text x="54" y="542" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#142338" text-anchor="start">Read the relevant new source</text><text x="54" y="571" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#142338" text-anchor="start">Run the appropriate checks</text><text x="54" y="600" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#142338" text-anchor="start">Return evidence and status</text><text x="54" y="629" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#142338" text-anchor="start">Each next action has its own gate</text></g>
<path d="M832 570 H774" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M432 570 H374" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="32" y="730" width="1136" height="80" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="2"/>
<text x="54" y="764" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#92400e" text-anchor="start">File changed while approval waited? Publication is refused when the snapshot check detects drift.</text>
<text x="54" y="794" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" fill="#92400e" text-anchor="start">Reread the current file and prepare a new edit. Never discard expectedSha256 to force a retry.</text>
<text x="32" y="863" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="400" fill="#475569" text-anchor="start">One program can contain several actions. A later failure does not roll back earlier published effects.</text>
<text x="32" y="904" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="400" fill="#475569" text-anchor="start">Snapshot and path checks detect conflicts; they are not OS-level isolation from hostile concurrent writers.</text>
</svg>
