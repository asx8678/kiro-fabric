name: Complete bundle candidates

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-candidates-${{ github.sha }}
  cancel-in-progress: false

jobs:
  candidate:
    # Runner labels do not certify availability. No signing secret reaches these jobs.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.ref_protected == true
    environment: complete-release-qualification
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, os: Linux, arch: x86_64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, os: Linux, arch: aarch64 }
          - { target: darwin-arm64, runner: macos-15, os: Darwin, arch: arm64 }
          - { target: darwin-x64, runner: macos-15-intel, os: Darwin, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Assert native host
        env: { TARGET: '${{ matrix.target }}', OS: '${{ matrix.os }}', ARCH: '${{ matrix.arch }}' }
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$OS"
          test "$(uname -m)" = "$ARCH"
          node -e 'if (`${process.platform}-${process.arch}` !== process.env.TARGET) process.exit(1)'
          if [ "$OS" = Darwin ]; then test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1; fi
      - run: npm install --global pnpm@11.20.0
      - name: Provision build prerequisites
        run: |
          if [ "$(uname -s)" = Linux ]; then sudo apt-get update; sudo apt-get install --yes ripgrep; else brew list ripgrep >/dev/null 2>&1 || brew install ripgrep; fi
          command -v rg
          rg --version
      - run: pnpm install --frozen-lockfile
      - name: Build exact clean source and prepare final candidate bytes
        env: { COMMIT: '${{ github.sha }}' }
        run: |
          set -euo pipefail
          umask 077
          pnpm run agent:bundle
          bundle=$(node -p 'JSON.parse(require("fs").readFileSync(".tmp/complete-bundle.json","utf8")).root')
          node scripts/prepare-complete-release.mjs "$bundle" "$PWD" "$PWD/.tmp/complete-release-candidate" "$COMMIT"
      - name: Retain exact unsigned candidate bytes and smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: complete-candidate-${{ github.sha }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .tmp/complete-release-candidate/kiro-fabric-*.tar.gz
            .tmp/complete-release-candidate/kiro-fabric-*.tar.gz.release.json
            .tmp/complete-release-candidate/kiro-fabric-*.tar.gz.spdx.json
            .tmp/complete-release-candidate/kiro-fabric-*.tar.gz.signing-input
            .tmp/complete-release-candidate/candidate.json
            .tmp/complete-release-candidate/native-smoke.json
      - name: Keep production pending
        if: always()
        run: echo 'Unsigned candidate only; installed/client/minimum-system evidence and production signatures remain mandatory. Missing runners are PENDING, never PASS.' >> "$GITHUB_STEP_SUMMARY"
