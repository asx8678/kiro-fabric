name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/assert-kiro-home-unchanged.mjs pnpm run check
      - name: Require matching GitHub-verified signed tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          test "$(jq -r '.object.type' <<<"$ref")" = "tag"
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r '.object.sha' <<<"$ref")")
          test "$(jq -r '.verification.verified' <<<"$tag")" = "true"
          test "$(jq -r '.object.type' <<<"$tag")" = "commit"
          test "$(jq -r '.object.sha' <<<"$tag")" = "$GITHUB_SHA"
      - name: Download exact-commit real-client evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow "Real Kiro Power qualification" --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" -n "real-client-${GITHUB_SHA}" -D "$RUNNER_TEMP/qualification"
          test -f "$RUNNER_TEMP/qualification/real-client.json"
      - name: Bind release report to real-client evidence
        run: |
          node scripts/release-candidate-report.mjs \
            --output "$RUNNER_TEMP/release.json" \
            --sbom .tmp/kiro-fabric-power.spdx.json \
            --qualification "$RUNNER_TEMP/qualification/real-client.json"
      - run: pnpm pack --pack-destination "$RUNNER_TEMP" --config.ignore-scripts=true
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          files: |
            ${{ runner.temp }}/kiro-fabric-*.tgz
            ${{ runner.temp }}/release.json
            ${{ runner.temp }}/qualification/real-client.json
