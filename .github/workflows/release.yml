name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write
  actions: read
  statuses: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Require a signed, version-matching tag
        run: |
          git verify-tag "${GITHUB_REF_NAME}"
          test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - name: Require real Kiro qualification for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '.statuses[] | select(.context == "kiro-power-real/all") | .state' | head -1)
          test "$state" = success
          run_id=$(gh run list --workflow "Real Kiro Power qualification" --commit "$GITHUB_SHA" --status success --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          gh run download "$run_id" -n kiro-power-real-qualification -D "$RUNNER_TEMP/qualification"
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run power:sync
      - name: Prove the release closure is reproducible
        run: >-
          git diff --exit-code --
          dist/kiro-closure
          dist/kiro-power-closure
          plugin.json
          mcp.json
          package.json
      - name: Produce Git-bound protocol certification
        run: >-
          node scripts/certify-kiro-power.mjs .tmp/kiro-fabric-power
          --json "$RUNNER_TEMP/kiro-power-certification.json"
      - name: Generate SPDX SBOM
        run: node scripts/generate-power-sbom.mjs --output "$RUNNER_TEMP/kiro-power-sbom.spdx.json"
      - name: Build immutable Power archive and checksums
        run: |
          archive="$RUNNER_TEMP/kiro-fabric-power-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="kiro-fabric-power-${GITHUB_REF_NAME}/" -o "$archive" HEAD -- \
            plugin.json mcp.json package.json skills dist/kiro-power-closure \
            docs/kiro/power.md LICENSE THIRD_PARTY_NOTICES.md
          cd "$RUNNER_TEMP"
          sha256sum "$(basename "$archive")" kiro-power-certification.json \
            kiro-power-sbom.spdx.json qualification/kiro-power-real-qualification.json \
            > SHA256SUMS
      - name: Sign GitHub artifact attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation sign "$RUNNER_TEMP/kiro-fabric-power-${GITHUB_REF_NAME}.tar.gz" --repo "$GITHUB_REPOSITORY"
          gh attestation sign "$RUNNER_TEMP/kiro-power-sbom.spdx.json" --repo "$GITHUB_REPOSITORY"
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "$RUNNER_TEMP/kiro-fabric-power-${GITHUB_REF_NAME}.tar.gz"
          "$RUNNER_TEMP/kiro-power-certification.json"
          "$RUNNER_TEMP/kiro-power-sbom.spdx.json"
          "$RUNNER_TEMP/qualification/kiro-power-real-qualification.json"
          "$RUNNER_TEMP/SHA256SUMS"
          --verify-tag --generate-notes --title "Kiro Fabric ${GITHUB_REF_NAME}"
