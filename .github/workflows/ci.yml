name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm install --global pnpm@11.20.0
      - name: Provision ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          command -v rg
          rg --version
      - run: pnpm install --frozen-lockfile
      - name: Dependency advisory audit
        run: pnpm run audit:deps
      - name: Hermetic full check
        run: node scripts/assert-kiro-home-unchanged.mjs pnpm run check
      - name: Reproducible complete Agent archive
        run: |
          pnpm run agent:archive
          cp .tmp/kiro-fabric-agent.tar.gz "$RUNNER_TEMP/first.tar.gz"
          pnpm run build
          node scripts/build-agent-dev.mjs
          pnpm run agent:archive
          cmp "$RUNNER_TEMP/first.tar.gz" .tmp/kiro-fabric-agent.tar.gz
          # Exact compressed-byte equality above is stronger than extracted-tree equality.
          # Do not add an unvalidated system-tar consumer for this redundant comparison.
          test -z "$(git status --porcelain)"
      - run: git diff --check

  installer-native-contracts:
    # Hosted runner availability is not qualification. Unscheduled targets remain PENDING.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, os: Linux, arch: x86_64 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm, os: Linux, arch: aarch64 }
          - { target: darwin-arm64, runner: macos-15, os: Darwin, arch: arm64 }
          - { target: darwin-x64, runner: macos-15-intel, os: Darwin, arch: x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      PNPM_STORE_DIR: ${{ runner.temp }}/kiro-fabric-pnpm-store
      TOOL_TRANSPORT: ${{ runner.temp }}/kiro-fabric-private-ci-cache/tool-transport
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - name: Assert actual native target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
          EXPECTED_OS: ${{ matrix.os }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "$EXPECTED_OS"
          test "$(uname -m)" = "$EXPECTED_ARCH"
          node -e 'if (`${process.platform}-${process.arch}` !== process.env.EXPECTED_TARGET) process.exit(1)'
          if [ "$EXPECTED_OS" = Darwin ]; then
            test "$(sysctl -in sysctl.proc_translated 2>/dev/null || true)" != 1
          else
            getconf GNU_LIBC_VERSION
          fi
      - run: npm install --global pnpm@11.20.0
      - name: Create private cache rematerialization parent
        run: |
          test ! -e "$RUNNER_TEMP/kiro-fabric-private-ci-cache"
          mkdir -m 700 "$RUNNER_TEMP/kiro-fabric-private-ci-cache"
      - name: Restore content-addressable pnpm store only
        id: pnpm-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: installer-pnpm-v1-${{ matrix.target }}-node24-pnpm11.20.0-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}
      - name: Restore untrusted pinned tool transport only
        id: tool-cache
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ env.TOOL_TRANSPORT }}
          key: installer-tools-v1-${{ matrix.target }}-${{ hashFiles('build-toolchain.json', 'scripts/installer-ci-cache.mjs') }}
      - name: Provision ripgrep for native runtime contracts
        run: |
          if [ "$(uname -s)" = Linux ]; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          else
            brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          fi
          rg --version
      - name: Materialize fresh dependencies with store verification
        run: pnpm install --frozen-lockfile --store-dir "$PNPM_STORE_DIR" --verify-store-integrity=true --package-import-method=copy
      - name: Verify and rematerialize pinned private tools
        env: { TARGET: "${{ matrix.target }}" }
        run: node scripts/installer-ci-cache.mjs restore "$TARGET" "$TOOL_TRANSPORT"
      - name: Installer/runtime contract suite (unavailable after test-suite removal)
        run: |
          set -euo pipefail
          umask 022
          root=$(mktemp -d "$RUNNER_TEMP/installer-contracts.XXXXXX")
          # May contain repositories or unknown child-created files: never recursively remove.
          printf 'Task root retained (no automatic cleanup): %s\n' "$root" >&2
          mkdir "$root/home" "$root/kiro" "$root/tmp"
          HOME="$root/home" KIRO_HOME="$root/kiro" TMPDIR="$root/tmp" node scripts/qualification-unavailable.mjs installer-contract-suite
      - name: Build and exercise the complete native bundle
        env: { TARGET: "${{ matrix.target }}" }
        run: |
          set -euo pipefail
          umask 022
          root=$(mktemp -d "$RUNNER_TEMP/installer-bundle.XXXXXX")
          # May contain repositories or unknown child-created files: never recursively remove.
          printf 'Task root retained (no automatic cleanup): %s\n' "$root" >&2
          mkdir "$root/home" "$root/kiro" "$root/tmp"
          export HOME="$root/home" KIRO_HOME="$root/kiro" TMPDIR="$root/tmp"
          pnpm run agent:bundle
          archive=$(node -p 'JSON.parse(require("fs").readFileSync(".tmp/complete-bundle.json","utf8")).archive')
          cp "$archive" "$root/first.tar.gz"
          if [ ! -e "$TOOL_TRANSPORT" ]; then
            node scripts/installer-ci-cache.mjs save "$TARGET" "$TOOL_TRANSPORT"
          fi
          # No receipt/complete-bundle reuse may satisfy reproducibility. Preserve
          # the first build and start a fresh artifact namespace, with verified tools.
          mv .tmp "$root/first-build"
          pnpm run build
          node scripts/installer-ci-cache.mjs restore "$TARGET" "$TOOL_TRANSPORT"
          node scripts/build-complete-bundle.mjs
          cmp "$root/first.tar.gz" "$archive"
          node scripts/qualification-unavailable.mjs installer-bundle-suite
      - name: Save verified pinned tool transport
        if: success() && steps.tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ env.TOOL_TRANSPORT }}
          key: ${{ steps.tool-cache.outputs.cache-primary-key }}
      - name: Save verified pnpm store
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: ${{ env.PNPM_STORE_DIR }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
      - name: Report qualification remains pending
        if: always()
        run: echo 'Installer native exact-artifact/client/signing qualification PENDING; contract tests do not qualify production binaries. Unavailable runners are PENDING, never PASS.' >> "$GITHUB_STEP_SUMMARY"

  macos-stage:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm install --global pnpm@11.20.0
      - name: Provision ripgrep
        run: |
          brew list ripgrep >/dev/null 2>&1 || brew install ripgrep
          command -v rg
          rg --version
      - run: pnpm install --frozen-lockfile
      - name: Hermetic macOS local staging
        run: node scripts/assert-kiro-home-unchanged.mjs pnpm run agent:stage:local
      - name: Focused macOS staging, install, and archive suite (unavailable after test-suite removal)
        run: node scripts/qualification-unavailable.mjs macos-staging-suite
      - name: Verify staging left tracked build outputs reproducible
        run: test -z "$(git status --porcelain)"
      - run: git diff --check

  local-dev-checks:
    # Local-development checks only. This lane is explicitly NOT release or
    # installer qualification; the release-grade and installer suites remain
    # fail-closed behind scripts/qualification-unavailable.mjs and are never
    # invoked here. It runs a fixed, honest subset that passes on the current
    # tree: guidance check, typecheck, a fresh build, the project reference
    # audit, and the offline baseline and focused lifecycle regressions.
    name: Local development checks (NOT release qualification)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { persist-credentials: false, fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm install --global pnpm@11.20.0
      - name: Provision ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          command -v rg
          rg --version
      - run: pnpm install --frozen-lockfile
      - name: Create retained local-development root
        id: local-dev-root
        run: |
          set -euo pipefail
          umask 022
          root=$(mktemp -d "$RUNNER_TEMP/local-dev-checks.XXXXXX")
          # May contain repositories or unknown child-created files: never recursively remove.
          printf 'Task root retained (no automatic cleanup): %s\n' "$root" >&2
          mkdir "$root/tmp"
          printf 'tmp=%s/tmp\n' "$root" >> "$GITHUB_OUTPUT"
      - name: Guidance check
        run: pnpm run guidance:check
      - name: Typecheck
        run: pnpm run typecheck
      - name: Fresh build
        env:
          TMPDIR: ${{ steps.local-dev-root.outputs.tmp }}
        run: pnpm run build
      - name: Project reference audit
        run: node scripts/verify-project-references.mjs
      - name: Offline baseline verification
        env:
          TMPDIR: ${{ steps.local-dev-root.outputs.tmp }}
        run: node scripts/verify-offline.mjs baseline
      - name: Focused lifecycle regressions (NOT release qualification)
        env:
          TMPDIR: ${{ steps.local-dev-root.outputs.tmp }}
        run: pnpm run verify:lifecycle
      - name: Focused locking, safety and contract regressions (NOT release qualification)
        env:
          TMPDIR: ${{ steps.local-dev-root.outputs.tmp }}
        run: pnpm run verify:remediation
