name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Node 24)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.25.1
          cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Full repository check (Linux)
        if: runner.os == 'Linux'
        run: pnpm run check
      - name: Cross-platform security core, build, and Power validation
        if: runner.os != 'Linux'
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm run test:security-core
          pnpm run power:validate

  reproducibility:
    name: reproducible Power closure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run power:sync
      - run: pnpm run certify:power:built
      - name: Prove generated artifacts match the commit
        run: >-
          git diff --exit-code --
          dist/kiro-closure
          dist/kiro-power-closure
          plugin.json
          mcp.json
          package.json
      - run: git diff --check

  lifecycle-stress:
    name: lifecycle stress (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:lifecycle:stress
      - name: Upload compact lifecycle failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-failure-${{ matrix.os }}
          path: .tmp/process-diagnostics/lifecycle-stress-failure.txt
          if-no-files-found: warn
