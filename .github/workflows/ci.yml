name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: 24 }
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - name: Hermetic full check
        run: node scripts/assert-kiro-home-unchanged.mjs pnpm run check
      - name: Reproducible closure
        run: |
          find dist/kiro-power-closure -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/first"
          pnpm run build
          find dist/kiro-power-closure -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/second"
          diff -u "$RUNNER_TEMP/first" "$RUNNER_TEMP/second"
          test -z "$(git status --porcelain)"
      - run: git diff --check
